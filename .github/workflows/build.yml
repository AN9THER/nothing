name: Build Kernarium IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Dummy Signing
        run: |
          cp GuestHost/Config/Signing.local.xcconfig.example GuestHost/Config/Signing.local.xcconfig

      - name: Prepare dependencies
        run: |
          chmod +x dependencies/prepare.sh
          ./dependencies/prepare.sh || true

      - name: Package iOS Frameworks
        run: |
          chmod +x Kernarium/scripts/package-ios-frameworks.sh
          ./Kernarium/scripts/package-ios-frameworks.sh --sdk device || true

      - name: Build Kernarium with Xcode
        run: |
          cd Kernarium
          xcodebuild -project Kernarium.xcodeproj \
            -scheme Kernarium \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package to IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Kernarium.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" build/Payload/
            cd build
            zip -r Kernarium-unsigned.ipa Payload
          else
            echo "Kernarium.app was not produced by Xcode build!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernarium-unsigned-ipa
          path: build/Kernarium-unsigned.ipa
